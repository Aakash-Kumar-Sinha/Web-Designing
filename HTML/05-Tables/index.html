<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>

    <h1>HTML Tables</h1>

    <!-- Basic Table -->
    <h2>Student Details</h2>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>21</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>22</td>
            <td>CSS</td>
        </tr>

    </table>


    <!-- Table with thead, tbody, tfoot -->
    <h2>Structured Table</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
            </tr>
        </thead>


        <tbody>
            <tr>
                <td>Laptop</td>
                <td>$500</td>
            </tr>

            <tr>
                <td>Mobile</td>
                <td>$300</td>
            </tr>
        </tbody>


        <tfoot>
            <tr>
                <td>Total</td>
                <td>$800</td>
            </tr>
        </tfoot>

    </table>


    <!-- Colspan Example -->
    <h2>Colspan Example</h2>

    <table border="1">

        <tr>
            <th colspan="2">Frontend Technologies</th>
        </tr>

        <tr>
            <td>HTML</td>
            <td>Structure</td>
        </tr>

    </table>


    <!-- Rowspan Example -->
    <h2>Rowspan Example</h2>

    <table border="1">

        <tr>
            <th rowspan="2">Frontend</th>
            <td>HTML</td>
        </tr>

        <tr>
            <td>CSS</td>
        </tr>

    </table>


</body>

</html>
