<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Media and Iframe</title>
</head>

<body>

    <h1>HTML Media Elements</h1>


    <!-- Audio -->
    <h2>Audio Example</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mp3">
        Your browser does not support audio.
    </audio>


    <!-- Video -->
    <h2>Video Example</h2>

    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>


    <!-- YouTube Embed using iframe -->
    <h2>YouTube Video</h2>

    <iframe
        width="400"
        height="250"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        allowfullscreen>
    </iframe>


    <!-- Website Embed -->
    <h2>Website Embed</h2>

    <iframe
        src="https://example.com"
        width="400"
        height="250">
    </iframe>


</body>

</html>
