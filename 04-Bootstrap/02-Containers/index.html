<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Containers</title>


    <!-- Bootstrap CSS CDN -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

</head>


<body>


    <!-- Fixed Width Container -->

    <div class="container bg-light p-4 mt-4">

        <h2>Container Example</h2>

        <p>
            This uses the Bootstrap container class.
        </p>

    </div>



    <!-- Full Width Container -->

    <div class="container-fluid bg-primary text-white p-4 mt-4">

        <h2>Container Fluid Example</h2>

        <p>
            This container takes full width of the screen.
        </p>

    </div>



    <!-- Responsive Container -->

    <div class="container-md bg-success text-white p-4 mt-4">

        <h2>Responsive Container</h2>

        <p>
            This container changes width based on screen size.
        </p>

    </div>



</body>

</html>
