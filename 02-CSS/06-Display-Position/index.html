<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Display and Position</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>CSS Display and Position</h1>


    <!-- Display Properties -->

    <h2>Display Examples</h2>

    <div class="block">
        Block Element
    </div>


    <span class="inline">
        Inline Element
    </span>


    <div class="inline-block">
        Inline Block Element
    </div>


    <!-- Position Properties -->

    <h2>Position Examples</h2>

    <div class="parent">

        Parent Element

        <div class="child">
            Absolute Position
        </div>

    </div>


    <div class="fixed">
        Fixed Position
    </div>


</body>

</html>
