<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Utilities</title>


    <!-- Bootstrap CSS CDN -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

</head>


<body>


    <div class="container mt-5">


        <h1 class="text-center mb-4">
            Bootstrap Utilities
        </h1>



        <!-- Spacing Utilities -->

        <div class="bg-primary text-white p-4 mb-3">

            Padding and Margin Example

        </div>



        <!-- Text Utilities -->

        <p class="text-danger fw-bold">

            Text color and font weight example.

        </p>



        <!-- Display Utilities -->

        <div class="d-none d-md-block bg-success text-white p-3">

            Visible on medium and larger screens.

        </div>



        <!-- Flex Utilities -->

        <div class="d-flex justify-content-center align-items-center bg-light mt-4 p-4">


            <div class="bg-warning p-3">

                Flexbox Utility

            </div>


        </div>



        <!-- Border Utilities -->

        <div class="border border-primary rounded p-3 mt-4">

            Border utility example.

        </div>



    </div>


</body>

</html>
