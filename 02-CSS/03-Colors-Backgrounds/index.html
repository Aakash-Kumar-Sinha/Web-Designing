<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Colors and Backgrounds</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>CSS Colors and Backgrounds</h1>


    <p class="name-color">
        This uses color name.
    </p>


    <p class="hex-color">
        This uses HEX color.
    </p>


    <p class="rgb-color">
        This uses RGB color.
    </p>


    <div class="box">

        <h2>Background Properties</h2>

        <p>
            CSS allows us to add colors and images to backgrounds.
        </p>

    </div>


</body>

</html>
