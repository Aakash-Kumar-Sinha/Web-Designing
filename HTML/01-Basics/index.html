<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes website responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>HTML Basics</title>
</head>

<body>

    <!-- Main heading -->
    <h1>Welcome to HTML Basics</h1>

    <!-- Paragraph -->
    <p>
        HTML stands for HyperText Markup Language.
        It is used to create the structure of web pages.
    </p>

    <!-- Horizontal line -->
    <hr>

    <!-- Different heading levels -->
    <h2>HTML Heading Examples</h2>

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>


    <!-- Line break example -->
    <p>
        This is first line.<br>
        This is second line.
    </p>


    <!-- HTML Comment -->
    <!-- This comment will not appear on the webpage -->

</body>

</html>
