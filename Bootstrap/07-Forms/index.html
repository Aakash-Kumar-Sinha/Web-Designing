<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Forms</title>


    <!-- Bootstrap CSS CDN -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

</head>


<body>


    <div class="container mt-5">


        <h1 class="mb-4">
            Bootstrap Forms
        </h1>


        <form>


            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input 
                type="text" 
                class="form-control" 
                placeholder="Enter your name">

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input 
                type="email" 
                class="form-control" 
                placeholder="Enter your email">

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input 
                type="password" 
                class="form-control" 
                placeholder="Enter password">

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Message
                </label>

                <textarea 
                class="form-control" 
                rows="4"></textarea>

            </div>



            <div class="mb-3 form-check">

                <input 
                type="checkbox" 
                class="form-check-input">


                <label class="form-check-label">
                    Accept terms
                </label>

            </div>



            <button class="btn btn-primary">
                Submit
            </button>


        </form>


    </div>


</body>

</html>
