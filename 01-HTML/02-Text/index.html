<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting</title>
</head>

<body>

    <h1>HTML Text Formatting Tags</h1>

    <!-- Bold text -->
    <p><b>This is bold text</b></p>

    <!-- Important text -->
    <p><strong>This is important text</strong></p>

    <!-- Italic text -->
    <p><i>This is italic text</i></p>

    <!-- Emphasized text -->
    <p><em>This text is emphasized</em></p>

    <!-- Highlighted text -->
    <p><mark>This text is highlighted</mark></p>

    <!-- Smaller text -->
    <p><small>This is smaller text</small></p>

    <!-- Deleted text -->
    <p><del>This text is deleted</del></p>

    <!-- Inserted text -->
    <p><ins>This text is inserted</ins></p>

    <!-- Subscript -->
    <p>
        H<sub>2</sub>O is water
    </p>

    <!-- Superscript -->
    <p>
        10<sup>2</sup> = 100
    </p>

    <!-- Combined example -->
    <p>
        <strong>HTML</strong> is used to
        <em>structure</em> web pages.
    </p>

</body>

</html>
