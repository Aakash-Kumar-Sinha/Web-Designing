<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>

<body>

    <h1>HTML Links and Images</h1>

    <!-- External Link -->
    <h2>External Link</h2>

    <a href="https://www.google.com">
        Visit Google
    </a>


    <!-- Open link in new tab -->
    <h2>Target Attribute</h2>

    <a href="https://github.com" target="_blank">
        Open GitHub in new tab
    </a>


    <!-- Email Link -->
    <h2>Email Link</h2>

    <a href="mailto:example@gmail.com">
        Send Email
    </a>


    <!-- Phone Link -->
    <h2>Phone Link</h2>

    <a href="tel:+1234567890">
        Call Us
    </a>


    <!-- Internal Link -->
    <h2>Internal Link</h2>

    <a href="about.html">
        About Page
    </a>


    <!-- Image -->
    <h2>Image Example</h2>

    <img 
        src="https://via.placeholder.com/300"
        alt="Sample Image"
        width="300"
    >


    <!-- Image as Link -->
    <h2>Clickable Image</h2>

    <a href="https://www.google.com">
        <img 
            src="https://via.placeholder.com/150"
            alt="Google Link Image"
        >
    </a>


    <!-- Bookmark Link -->
    <h2 id="top">Bookmark Example</h2>

    <p>
        This section demonstrates page navigation.
    </p>

    <a href="#top">
        Go to Top
    </a>


</body>

</html>
