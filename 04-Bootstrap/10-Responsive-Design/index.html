<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Responsive Design</title>


    <!-- Bootstrap CSS CDN -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

</head>


<body>


    <div class="container mt-5">


        <h1 class="text-center mb-4">
            Bootstrap Responsive Design
        </h1>



        <!-- Responsive Grid -->

        <div class="row">


            <div class="col-12 col-md-6 col-lg-4 bg-primary text-white p-4">

                Mobile: Full Width<br>
                Tablet: Half Width<br>
                Desktop: One Third Width

            </div>



            <div class="col-12 col-md-6 col-lg-4 bg-success text-white p-4">

                Responsive Column

            </div>



            <div class="col-12 col-md-12 col-lg-4 bg-danger text-white p-4">

                Responsive Column

            </div>


        </div>



        <!-- Responsive Display -->


        <div class="mt-4">


            <div class="d-block d-md-none bg-warning p-3">

                Visible only on mobile

            </div>



            <div class="d-none d-md-block bg-info p-3">

                Visible on tablet and desktop

            </div>


        </div>



        <!-- Responsive Text -->


        <h2 class="text-center text-md-start mt-4">

            Responsive Text Alignment

        </h2>


    </div>


</body>

</html>
